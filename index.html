<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdani — Client Service Dashboard</title>
<style>
:root{
  --ink:#101828;        /* report table header navy */
  --ink-soft:#1d2939;
  --slate:#475467;
  --slate-2:#667085;
  --line:#e4e7ec;
  --line-soft:#f1f3f6;
  --paper:#ffffff;
  --paper-2:#f8fafc;
  --verd:#0f7a52;       /* Verdani green */
  --verd-dk:#0a5c3e;
  --verd-tint:#e8f4ee;
  --good:#0f7a52;
  --watch:#b54708;
  --watch-tint:#fdf3e7;
  --over:#b42318;
  --over-tint:#fdeceb;
  --good-tint:#e8f4ee;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper-2); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em}
a{color:var(--verd-dk)}
.wrap{max-width:1240px; margin:0 auto; padding:0 24px 64px}

/* ---------- masthead ---------- */
.masthead{background:var(--ink); color:#fff; border-bottom:3px solid var(--verd)}
.masthead .wrap{padding-top:20px; padding-bottom:20px; display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:space-between}
.brand{display:flex; align-items:center; gap:12px}
.mark{width:30px;height:30px;flex:none}
.brand-text h1{font-size:19px; color:#fff}
.brand-text p{margin:2px 0 0; font-size:12.5px; color:#98a2b3}
.controls{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap}
.field label{display:block; font-size:11.5px; color:#98a2b3; margin-bottom:4px}
select,input[type=search],input[type=number]{
  font:inherit; font-size:13.5px; color:var(--ink); background:#fff;
  border:1px solid #d0d5dd; border-radius:6px; padding:7px 9px; min-height:36px;
}
select{min-width:250px; max-width:min(70vw,320px)}
input[type=number]{width:78px}
button{font:inherit; cursor:pointer; border-radius:6px; border:1px solid #d0d5dd; background:#fff; padding:7px 11px; min-height:36px}
button:hover{background:var(--line-soft)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff}
.seg button{border:0; border-radius:0; border-left:1px solid var(--line); font-size:12.5px; padding:6px 11px; color:var(--slate)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink); color:#fff}
:focus-visible{outline:2px solid var(--verd); outline-offset:2px}

.scope{background:#fff; border-bottom:1px solid var(--line)}
.scope .wrap{padding:9px 24px; font-size:12.5px; color:var(--slate-2); display:flex; gap:18px; flex-wrap:wrap}
.scope b{color:var(--ink-soft); font-weight:600}

/* ---------- sections ---------- */
section{margin-top:28px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:12px}
.sec-head h2{font-size:16.5px}
.sec-head p{margin:3px 0 0; font-size:12.5px; color:var(--slate-2); max-width:78ch}
.card{background:#fff; border:1px solid var(--line); border-radius:10px}
.pad{padding:18px}

/* ---------- kpi tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px}
.tile{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 15px}
.tile .k{font-size:12px; color:var(--slate-2)}
.tile .v{font-size:24px; font-weight:700; letter-spacing:-.02em; margin-top:5px}
.tile .v small{font-size:13px; font-weight:600; color:var(--slate)}
.tile .n{font-size:12px; color:var(--slate-2); margin-top:3px}
.tile.lead{background:var(--ink); border-color:var(--ink); color:#fff}
.tile.lead .k,.tile.lead .n{color:#98a2b3}
.delta{font-size:12px; font-weight:600}
.d-good{color:var(--good)} .d-bad{color:var(--over)}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse}
thead th{
  background:var(--ink); color:#fff; font-size:12px; font-weight:600; text-align:left;
  padding:10px 12px; white-space:nowrap; position:sticky; top:0; z-index:2;
}
thead th.num{text-align:right}
thead th[data-sort]{cursor:pointer}
thead th[data-sort]:hover{background:var(--ink-soft)}
thead th .arw{opacity:.45; font-size:10px}
tbody td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody td.num{text-align:right; white-space:nowrap}
tbody tr:nth-child(even){background:var(--paper-2)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--verd-tint)}
.cname{font-weight:600}
.muted{color:var(--slate-2)}
.tbl-scroll{max-height:640px; overflow:auto; border-radius:10px; border:1px solid var(--line); background:#fff}
.pill{display:inline-block; padding:1px 7px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap}
.p-good{background:var(--good-tint); color:var(--verd-dk)}
.p-fast{background:var(--verd); color:#fff}
.p-avg{background:#fff; color:var(--slate); border:1px solid #cfd6e0}
.p-watch{background:var(--watch-tint); color:var(--watch)}
.p-over{background:var(--over-tint); color:var(--over)}
.p-none{background:var(--line-soft); color:var(--slate-2)}
.tag{display:inline-block; padding:1px 6px; border:1px solid var(--line); border-radius:4px; font-size:11px; color:var(--slate-2)}

/* ---------- charts ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid-3-1{display:grid; grid-template-columns:2fr 1fr; gap:16px}
@media (max-width:900px){.grid2,.grid-3-1{grid-template-columns:1fr}}
.chart-title{font-size:13px; font-weight:600; margin-bottom:2px}
.chart-sub{font-size:12px; color:var(--slate-2); margin-bottom:12px}
svg{display:block; width:100%; height:auto; overflow:visible}
.bar-row:hover .bar{fill:var(--verd-dk)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--slate); margin-top:8px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

.key{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--slate-2); margin:0 0 10px}

/* ---------- callout ---------- */
.callout{background:var(--watch-tint); border:1px solid #f3d5b0; border-left:4px solid var(--watch); border-radius:8px; padding:14px 16px; font-size:13px; color:#7a3c05; line-height:1.55}
.callout b{color:#5c2d04}

/* ---------- client view ---------- */
.chead{display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; align-items:flex-start;
  background:#fff; border:1px solid var(--line); border-left:4px solid var(--verd); border-radius:10px; padding:18px}
.chead h2{font-size:22px; letter-spacing:-.02em}
.chead .sub{font-size:13px; color:var(--slate-2); margin-top:5px}
.calls-note{font-size:12.5px; color:var(--slate-2); margin:0 0 10px}
details.callrow summary{cursor:pointer; color:var(--verd-dk); font-size:12.5px}
.notes{font-size:12.5px; color:var(--slate); line-height:1.6}
.notes li{margin-bottom:5px}
.empty{padding:26px 18px; text-align:center; color:var(--slate-2); font-size:13px}
.hide{display:none !important}
.foot{margin-top:34px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--slate-2); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

@media print{
  body{background:#fff}
  .masthead{background:#fff; color:var(--ink); border-bottom:2px solid var(--ink)}
  .brand-text h1,.brand-text p{color:var(--ink)}
  .controls,.no-print{display:none !important}
  .tbl-scroll{max-height:none; overflow:visible}
  thead th{background:var(--ink) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  section{break-inside:avoid}
  .tile.lead{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
}
</style>
</head>

DNS filters and requesting a computer restart, but the problem persisted throughout the conversation."},{"t":"2026-08-25T17:52:29","ag":"Oliver Cromwell","w":7,"k":69,"a":1,"s":4.0,"src":"contact","lb":"Illiquidx Limited Margita Hoxha","q":"Helpdesk","sum":"The conversation involves a discussion about an ongoing software installation and ensuring a receiver and cable are connected. The caller must leave by 6 but agrees the conversation can continue tomorrow or without him. There's an agreement to restart the computer after installation and log in as admin."},{"t":"2026-08-25T17:07:36","ag":"Oliver Cromwell","w":28,"k":1304,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Oliver from VTSG helped Marketa troubleshoot a connection issue with her Bluetooth headphones. Despite trying various steps including checking connectivity and settings, they could not resolve the issue during the call. Oliver decided to look for the model for potential drivers and planned to follow up later."},{"t":"2026-08-25T10:30:11","ag":"Ian Welch","w":4,"k":538,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Jamie Crouch from Mimecast called back Ian regarding a client, IlliquidX, experiencing email delays. It was discovered that IlliquidX, supposed to have churned their contract with Mimecast in March, still had active services. Ian committed to preparing a quote for potentially re-enabling services and adding IlliquidX\u2019s Dubai tenant, considering compliance with local regulations."},{"t":"2026-08-24T17:58:58","ag":"Ian Welch","w":56,"k":804,"a":1,"s":2.0,"src":"contact","lb":"Illiquidx Limited Celestino Amore (Illiquidx)","q":"Helpdesk","sum":"Ian is experiencing issues with Outlook on his office PC; it is slow and unresponsive. The support suggests switching to a new version of Outlook because his current version, which stores emails locally, is overloaded and causing problems. They decide to move to the cloud-based version of Outlook despite Ian's reservations about its appearance."},{"t":"2026-08-24T10:24:40","ag":"Jansen Paul Villafuerte","w":37,"k":3016,"a":1,"s":3.5,"src":"named","lb":"","q":"Helpdesk","sum":"Margita called Dishan for assistance with setting up her wireless headset for use with Webex and her computer. Despite trying multiple solutions, including checking Bluetooth connections, rebooting, and updating drivers, the headset failed to connect successfully or show up on the device list, and they could not identify the model number during the call. Dishan attempted to troubleshoot further by"},{"t":"2026-08-24T10:09:24","ag":"Bao Nguyen","w":12,"k":337,"a":1,"s":3.5,"src":"named","lb":"","q":"Helpdesk","sum":"The customer needed assistance with setting up an add-on but did not have the required setup file ready. The technician guided the customer through closing and reopening programs and logging into relevant applications for Excel and Word, ensuring that necessary features were already installed or activated."},{"t":"2026-08-21T16:44:35","ag":"Jansen Paul Villafuerte","w":57,"k":1173,"a":1,"s":4.0,"src":"contact","lb":"Illiquidx Limited Eduardo Villaverde Linares","q":"Helpdesk","sum":"The customer called to follow up on a support ticket regarding an issue with accessing Clod in Microsoft Office applications using their Liquidex account. The support agent remoted into the customer's device, identified the problem, and resolved the issue by signing the customer out and back into the Clod app. The support extended to enabling Clod functionality across other Office applications lik"},{"t":"2026-08-21T15:48:30","ag":"Oliver Cromwell","w":26,"k":219,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"David called about an issue where he receives a message to upgrade his Microsoft Office plan on ticket T202608, despite being on a plan that should include the needed features. His colleagues have encountered and resolved the same issue. The assigned engineer, Dishon, will call David back shortly to resolve it."},{"t":"2026-08-20T17:55:34","ag":"Oliver Cromwell","w":18,"k":93,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Margita from eLiquidX called Oliver at VTSG about issues with her cloud access, receiving an error message that her account isn't associated with an organization. Oliver advised her to email the helpdesk for server configuration and promised to look into the issue once he received her email."},{"t":"2026-08-20T11:03:16","ag":"Ryan Brazil","w":164,"k":768,"a":1,"s":3.0,"src":"contact","lb":"Illiquidx Limited Francis Laratta","q":"Helpdesk","sum":"Frank Lerato from Liquidex requested help installing add-ons including Clod in Word and Excel on his computer. Ryan, the technician, suggested that these should automatically integrate but found out there might be a compatibility issue due to different versions of Office installed. They planned to reinstall Office, and Ryan agreed to call Frank back in the afternoon to continue the process."},{"t":"2026-08-20T10:58:54","ag":"","w":240,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-08-20T09:47:51","ag":"Dishon Pawar","w":108,"k":338,"a":1,"s":1.0,"src":"number","lb":"","q":"Helpdesk","sum":"Nojan from LiquidX contacted the help desk regarding an urgent issue accessing a link containing lawsuit documents, crucial for a $100 million deal. Despite ongoing communication since Monday, the issue persisted until Ryan resolved it by directly placing the documents on Nojan's desktop. Nojan expressed frustration over the delay and the lack of urgency, requesting that such delays not recur due "},{"t":"2026-08-20T09:04:01","ag":"Rez Lander","w":44,"k":254,"a":1,"s":2.0,"src":"number","lb":"","q":"Helpdesk","sum":"Nojan called VTSG with an urgent request to gain access to downloads needed for a Monday morning meeting, referencing an unresolved ticket (T-202-60817.0033). The representative acknowledged the issue and promised to discuss it with Ryan, the employee previously handling the ticket, and attempt to resolve the access restrictions."},{"t":"2026-08-18T14:28:17","ag":"Rez Lander","w":54,"k":369,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Nojan Rustami from Illiquid X contacted ZTSG support regarding recurring access issues to the AI platform Claude. Although previously resolved, the problem reoccurred. After discussing and troubleshooting with the support representative, including restarting his device, access to the platform was restored. The representative agreed to keep the support ticket open should the problem recur."},{"t":"2026-08-12T14:35:33","ag":"Ian Welch","w":21,"k":574,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Margita reported that her cloud app was inaccessible from her computer. The technician identified the issue as a blocked policy on her device, PC45, and found it was trying to start a browser instead of the app. They advised a reboot and planned a follow-up after Margita restarted her computer."},{"t":"2026-08-11T13:02:33","ag":"Nazheer Beedassy","w":8,"k":383,"a":1,"s":3.0,"src":"contact","lb":"Illiquidx Limited Lorenzo Reati","q":"Helpdesk","sum":"The caller from Illiquidex inquired about restricted web search functionality in the Claude installation, indicating it might be a design feature or an installation issue. The representative confirmed that the restriction on internet access was indeed by design, set to comply with organizational trust policies decided by directors Galena and Celestino. The caller will discuss with Galena about pos"},{"t":"2026-08-11T12:42:36","ag":"","w":227,"k":0,"a":0,"s":null,"src":"contact","lb":"Illiquidx Limited Lorenzo Reati","q":"Helpdesk","sum":""},{"t":"2026-08-10T18:03:48","ag":"Voicemail Box","w":0,"k":4,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-08-10T10:17:44","ag":"Dishon Pawar","w":52,"k":1049,"a":1,"s":4.0,"src":"number","lb":"","q":"Helpdesk","sum":"The caller, Marjita, confirmed she would handle a task concer "Joe Knoll, a new employee at Emotive, contacted tech support because he couldn't see certain teams in the Teams app. It was discovered that there were two accounts set up under his name due to an email discrepancy. Tech support found he was missing from two channels and added him while confirming access to the correct channels had been granted based on his onboarding request."},{"t":"2026-09-01T12:48:33","ag":"Rez Lander","w":10,"k":1007,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Lucy from Emotive reported an issue where Microsoft Teams crashes when she tries to share her screen during meetings. Tech support remotely accessed her device, performed updates, and confirmed the issue was resolved after testing. A support ticket was created to follow up on the matter."},{"t":"2026-09-01T11:51:27","ag":"Jansen Paul Villafuerte","w":20,"k":668,"a":1,"s":1.5,"src":"named","lb":"Emma Peplow","q":"Helpdesk","sum":"Emma from Emotive contacted Ryan to express dissatisfaction with the incorrect onboarding of an employee's email address. The employee was set up with \"joseph.nor\" instead of \"joe.nor,\" despite prior communications specifying the correct address. Additional issues included delays and errors in onboarding by a new staff member. Ryan agreed to correct the email address, update account details, and c"},{"t":"2026-09-01T10:37:36","ag":"Jansen Paul Villafuerte","w":36,"k":3816,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Juliette Hewin called Videsha Help and Support to assist Joe Noor with his onboarding for Mac Tribe. They did not have a password for Joe's laptop. After several unsuccessful password attempts, they switched to an admin account, which worked, allowing them to connect the laptop to the internet for further setup."},{"t":"2026-09-01T10:21:40","ag":"Rez Lander","w":6,"k":40,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Rez from Newark will email Lisa his landline number due to poor mobile signal, intending to continue their conversation using that."},{"t":"2026-08-26T17:12:02","ag":"Bao Nguyen","w":32,"k":1093,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"The caller was unable to tag people or add symbols to a PowerPoint document on a new laptop. After trying various fixes, including restarting the laptop, the issue was resolved by ensuring the caller was signed in correctly and accessing the document as an admin through Microsoft PowerPoint, restoring full functionality."},{"t":"2026-08-19T16:02:48","ag":"Dishon Pawar","w":33,"k":433,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Emily from Emotive called the helpdesk to obtain the administrator's name and password to install some software. Dishon, the helpdesk assistant, remotely connected to her PC and successfully installed the required software."},{"t":"2026-08-19T10:45:49","ag":"Jaydon Josephs","w":73,"k":157,"a":1,"s":2.0,"src":"named","lb":"","q":"Helpdesk","sum":"The caller contacted customer service to expedite the setup of a new freelancer on their IP service, citing a delay in callback. They provided a ticket number for reference. There were issues with call quality during the conversation."},{"t":"2026-08-19T10:27:42","ag":"Rez Lander","w":29,"k":167,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Juliet from Emotive called to set up IT for a freelancer, Tayyiba Ali, and provided a ticket number for reference. The service team acknowledged prior attempts to reach out and requested to call Juliet back in five minutes to resolve the issue."},{"t":"2026-08-19T08:44:25","ag":"Rez Lander","w":18,"k":423,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Patrick Chen from Emotive called support because he was locked out of his account while overseas. The support service decided to remove location-based restrictions for his account in Lithuania and Estonia to resolve the issue, instructing him to wait 15 minutes for the changes to take effect."},{"t":"2026-07-24T09:52:28","ag":"","w":83,"k":0,"a":0,"s":null,"src":"contact","lb":"Emotive (Agency) Ltd Nairn Marnie","q":"Helpdesk","sum":""},{"t":"2026-07-15T09:11:45","ag":"Promi Sheikh","w":6,"k":50,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-15T09:07:27","ag":"Promi Sheikh","w":88,"k":87,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-09T14:25:09","ag":"","w":173,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-09T11:09:36","ag":"","w":240,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-09T11:07:03","ag":"Jaydon Josephs","w":108,"k":29,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-06-09T15:48:24","ag":"Promi Sheikh","w":32,"k":269,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""}],"Little Tiger Press":[{"t":"2026-09-02T17:22:54","ag":"Bao Nguyen","w":12,"k":376,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Lauren contacted support about an issue with OneDrive downloading excessive files on her laptop, which prevented her from uploading or accessing specific files. The support agent suggested leaving her laptop on to allow OneDrive to complete syncing the changes made during her maternity leave and recommended calling back if the problem persists after allowing the sync to run."},{"t":"2026-09-02T10:04:07","ag":"Dishon Pawar","w":51,"k":2211,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Lauren Woods contacted Helpdesk requesting assistance with updating software on her computer, as her regular technician, Oliver, was unavailable. She needed updates for OneDrive, Adobe Creative Cloud, and Extensys Connect. The Helpdesk representative, Dishan, proceeded to address these updates by first troubleshooting access to her computer and planning to update the necessary software components "},{"t":"2026-08-26T11:34:02","ag":"Dylan Waterhouse","w":49,"k":627,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Belle Simpson from Little Tiger requested to be added to the office printer to enable scanning documents directly to her email. Additionally, she requested to update the email address for her colleague, Nicola Edwards, on the printer's address book. The tech support personnel successfully updated both email settings to facilitate scanning functions."},{"t":"2026-08-25T12:14:27","ag":"Dylan Waterhouse","w":95,"k":627,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Charlie Moiler called support because his MacBook Pro restarted twice unexpectedly due to automatic updates. The IT helper confirmed that the updates were not managed by their side but were part of the usual macOS updates. Charlie also requested and received assistance with updating another app during the call."},{"t":"2026-08-25T10:01:37","ag":"Ian Welch","w":32,"k":232,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Kimberly Chen from Little Tiger Press called for help with logging into her computer after an update required her to sign into her Apple account but was unsure of the password. The issue involved identifying her account on an iMac labeled as Kimberly's iMac."},{"t":"2026-08-24T15:31:09","ag":"Jansen Paul Villafuerte","w":78,"k":1207,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Belle Simpson from Little Tiger contacted VDSG Helpdesk because she couldn't access a shared folder named \"CBL Editorial\" on the server, receiving an error that the original item couldn't be found. The helpdesk resolved the issue by replacing a non-functioning sidebar shortcut with a working one, restoring access to the folder."},{"t":"2026-08-20T12:18:40","ag":"Promi Sheikh","w":7,"k":56,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Rebecca from Little Tiger UK called Blair because her internet stopped working, preventing her from sending emails. After experiencing poor call quality and communication issues, Rebecca decided to call back later."},{"t":"2026-08-20T10:38:23","ag":"Dishon Pawar","w":17,"k":178,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Laura Data from Little Tiger Press reported that her MacBook overheats since an OS update. She was advised by Jensen from the Help Desk to call for assistance. The agent confirmed they would have Jensen call her back to address the issue."},{"t":"2026-08-18T11:03:10","ag":"","w":15,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-08-18T11:00:56","ag":"","w":78,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-08-18T10:58:00","ag":"Promi Sheikh","w":8,"k":131,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Kimberly Kim from Tiger Press is unable to log into her iMac at the office because her account is locked. She repeatedly receives a message stating the account is locked and needs assistance to access her computer. The support person acknowledges the issue and begins troubleshooting her connectivity and system status."},{"t":"2026-08-18T09:00:33","ag":"Promi Sheikh","w":16,"k":90,"a":1,"s":5.0,"src":"named","lb":"","q":"Helpdesk","sum":"Abder assisted Sarah Fisher from Little Tiger Press with logging into her computer after an operating system update required her to sign into her Apple account. Abder guided her to use the \"sign in later\" option, ensuring she could access her device without immediately signing in."},{"t":"2026-08-17T11:46:22","ag":"Dishon Pawar","w":5,"k":696,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Maria Delord from Little Tiger contacted helpdesk because she couldn't connect to the server through VPN using her passwords. The helpdesk agent, Dishon, logged into the tenant to address the issue, and upon discovering potential password errors that may have locked her out, decided to reset her password."},{"t":"2026-08-17T11:31:28","ag":"Bao Nguyen","w":41,"k":282,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"The caller was experiencing an issue with their MacBook Air where it was defaulting to an old user profile after attempting to sign into their current one. The support agent assisted by verifying the device and accounts, then successfully restored access to the correct user profile."},{"t":"2026-08-17T11:15:38","ag":"Bao Nguyen","w":4,"k":409,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Charlie Moeller from Little Tiger contacted the help desk because multiple computers, including his own, unexpectedly crashed and restarted due to what was believed to be a planned system update. The help desk confirmed there was no ticket for this update and proceeded to remotely access Charlie's computer to investigate. They clarified the functionality and permissions associated with their remot"},{"t":"2026-08-17T11:12:39","ag":"Oliver Cromwell","w":22,"k":116,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Isabel Simpson from Little Tiger reported her laptop was behaving unusually, as if someone was remotely controlling it. Oliver from VTSG promised to investigate if anyone had remotely accessed her computer and to review the automatic update settings before getting back to her."},{"t":"2026-08-17T11:06:35","ag":"Ian Welch","w":20,"k":152,"a":1,"s":3.0,"src":"named","lb":"Amal Alin","q":"Helpdesk","sum":"Ian from Little Tiger contacted Mal regarding an unscheduled automatic computer update affecting around 10 employees, causing disruptions during meetings. Mal confirmed the updates were likely due to a policy or patch implemented via their management engine and agreed to review and possibly adjust the policy to prevent such disruptions."},{"t":"2026-08-14T10:49:43","ag":"Dishon Pawar","w":19,"k":48,"a":1,"s":3.0,"src":"contact","lb":"Little Tiger Press Katie Hawksworth","q":"Helpdesk","sum":"Trishant helped Katie ensure all tasks were closed on her Mac before starting an installation process."},{"t":"2026-08-14T10:24:11","ag":"Dishon Pawar","w":10,"k":315,"a":1,"s":3.0,"src":"contact","lb":"Little Tiger Press Katie Hawksworth","q":"Helpdesk","sum":"During a technical support call, a user reported an error while installing Mac OS Tahoe, stating it could not be verified. The technician checked space availability, ensured the device was charging, and asked for the user's password to proceed with troubleshooting steps. They advised that the process would take some time to complete."},{"t":"2026-08-14T10:14:04","ag":"Dishon Pawar","w":6,"k":37,"a":1,"s":4.0,"src":"number","lb":"","q":"Helpdesk","sum":"The caller couldn't initially find a specific email they were supposed to monitor, but eventually located it during the conversation."},{"t":"2026-08-14T09:47:06","ag":"Dishon Pawar","w":9,"k":1221,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Katie from Little Tiger Press called the Helpdesk because her Microsoft Teams wasn't working on her laptop, and she needed antivirus installation on the same device. Dishon from Helpdesk remotely accessed her computer to assist with these issues."},{"t":"2026-08-10T15:13:16","ag":"Bao Nguyen","w":12,"k":570,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Rebecca from Little Tiger Press called the help desk because her internet was not working on her office device. The help desk assisted her by suggesting a restart of her device and checking its connection, which resolved the issue."},{"t":"2026-08-07T15:23:32","ag":"Nazheer Beedassy","w":20,"k":832,"a":1,"s":null,"src":"number","lb":"Amal Alin","q":"Helpdesk","sum":""},{"t":"2026-08-07T15:21:06","ag":"Oliver Cromwell","w":41,"k":1,"a":1,"s":null,"src":"number","lb":"Amal Alin","q":"Helpdesk","sum":""},{"t":"2026-08-07T15:04:56","ag":"","w":44,"k":0,"a":0,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-28T11:47:01","ag":"Dylan Waterhouse","w":96,"k":212,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-27T08:49:33","ag":"Dishon Pawar","w":30,"k":1670,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""} change, corrected login credentials, and resolved access to both her office PC and a payroll PC. Dishant guided Diti through the process remotely, enabling her to work on both machines simultaneously."},{"t":"2026-08-24T12:51:17","ag":"Oliver Cromwell","w":20,"k":215,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Renee from Nova contacted Oliver to resolve a login issue for a new starter, Siraj Parmar. Despite having the password, Renee lacked the correct login details. Oliver confirmed it should be Siraj@BlueVanilla.com, but when it didn't work, Oliver decided to investigate further and follow up with a call."},{"t":"2026-08-24T12:32:13","ag":"Jansen Paul Villafuerte","w":26,"k":596,"a":1,"s":3.0,"src":"contact","lb":"Nova of London Ltd Krishna Mody","q":"Helpdesk","sum":"Azad Subhan called VTS helpdesk to gain access to an old email account of a former employee, Laura Brenly, to retrieve important documents. The helpdesk struggled to find Laura's inbox, which had been deactivated after her departure in 2024. They considered temporarily reinstating the email to facilitate Azad's access."},{"t":"2026-08-21T14:06:58","ag":"Promi Sheikh","w":45,"k":248,"a":1,"s":4.0,"src":"contact","lb":"Nova of London Ltd Krishna Mody","q":"Helpdesk","sum":"The caller from Nova of London requested assistance with downloading Adobe Illustrator on a new computer, specifying that admin credentials were needed. The support rep confirmed that while they couldn't manage Adobe accounts, they could assist with the admin-related download. Remote support was provided to install Adobe Illustrator and Photoshop through the Creative Cloud on the caller's specifie"},{"t":"2026-08-21T12:05:46","ag":"","w":72,"k":0,"a":0,"s":null,"src":"contact","lb":"Nova of London Ltd Deeti Masalia","q":"Helpdesk","sum":""},{"t":"2026-08-21T10:59:39","ag":"Jansen Paul Villafuerte","w":20,"k":1244,"a":1,"s":3.0,"src":"contact","lb":"Nova of London Ltd Deeti Masalia","q":"Helpdesk","sum":"DT from NOVA ca ondon Ltd Krishna Mody","q":"Helpdesk","sum":"Kewal wanted to install a thermal printer (Zebra ZB506) via USB on his computer named \"Online Dispatch.\" The support team raised a ticket and guided him through the installation process, which included installing drivers and troubleshooting connection issues. The printer was successfully installed and set as the default for FedEx, but not for other general printing needs."},{"t":"2026-08-13T09:43:42","ag":"Dishon Pawar","w":18,"k":1808,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Aneesha from Nova of London contacted Helpdesk about a problem where documents she uploaded to a shared folder were visible to her but not to her team. The Helpdesk assistant remotely accessed her PC, verified that synchronization was functioning correctly through a test, and concluded there was no sync issue with the web version. Aneesha also inquired about email syncing problems in different fol"},{"t":"2026-08-12T13:18:43","ag":"Ryan Brazil","w":18,"k":81,"a":1,"s":4.0,"src":"contact","lb":"Nova of London Ltd Krishna Mody","q":"Helpdesk","sum":"Ryan from Nova requested to modify SharePoint access by removing Ula1 and adding Sophie, which Agathe confirmed she could update within a couple of minutes."},{"t":"2026-08-12T12:43:33","ag":"","w":12,"k":0,"a":0,"s":null,"src":"contact","lb":"Nova of London Ltd Krishna Mody","q":"Helpdesk","sum":""},{"t":"2026-08-12T12:36:41","ag":"","w":23,"k":0,"a":0,"s":null,"src":"contact","lb":"Nova of London Ltd Deeti Masalia","q":"Helpdesk","sum":""},{"t":"2026-08-12T11:00:32","ag":"Nazheer Beedassy","w":164,"k":539,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"The caller, using a personal laptop for remote work, was unable to connect due to a changed IP address. The customer support guided the caller through accessing a website to download necessary software, updated the IP settings, and instructed on how to handle similar issues in the future."},{"t":"2026-08-11T14:04:51","ag":"Dish ne","lb":"","q":"LAMDA Hotline","sum":"Tom Gilder contacted support because he couldn't add his school email account to Microsoft's authentication system. He managed to log in using his Lambda email after troubleshooting and was advised to update his password, hinting at a possible resolution."},{"t":"2026-09-04T16:16:14","ag":"Promi Sheikh","w":60,"k":71,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Nick Chin contacted support because he was unable to access his Lambda email account. He was provided with an email address (help@vtsg.co.uk) to send troubleshooting details for further assistance."},{"t":"2026-09-04T14:42:10","ag":"Rez Lander","w":47,"k":99,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Curtis called to report an error code 700003 while trying to sign into Outlook on his work-assigned Dell PC. The support representative planned to coordinate with an on-site technician at Lambda to resolve the issue."},{"t":"2026-09-04T11:41:45","ag":"Ryan Brazil","w":93,"k":2616,"a":1,"s":2.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"The customer, Samara Lassie, contacted support to reset her Outlook password and reconfigure the Microsoft Authenticator app due to a verification issue. The support representative reset the password and 2FA settings, but Samara faced difficulties with the Authenticator app and website access. Attempts to resolve the issue included password resets and using different URLs, but they ended without c"},{"t":"2026-09-04T09:51:03","ag":"Promi Sheikh","w":167,"k":348,"a":1,"s":4.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Samara Lassie, a student at Landark, called because she was unable to access her email account after being signed out and unable to change her password. During the call, she successfully received a new password and was instructed to contact Lydia Harrison for issues with another service, Asimov, which was not managed by the call responder."},{"t":"2026-09-03T19:29:04","ag":"Oliver Cromwell","w":13,"k":177,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Kelly was unable to log in due to an incorrect password error. Oliver from VTSC confirmed the password details and reset it while asking Kelly to attempt logging in after five minutes with the same password settings."},{"t":"2026-09-03T19:22:38","ag":"Oliver Cromwell","w":15,"k":196,"a":1,"s":4.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Oliver from VTSC assisted Kelly Garrett, who was unable to log into her Microsoft Outlook account from Lambda company. Oliver reset Kelly's password to resolve the issue."},{"t":"2026-09-03T10:38:14","ag":"Meenash Fernandes","w":42,"k":563,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Judith Ross called support because she was locked out of her Lambda account. The support representative verified her details and informed her that the account would be unlocked within 10 to 15 minutes."},{"t":"2026-09-01T15:00:51","ag":"Meenash Fernandes","w":27,"k":149,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"The caller needed help correcting a misspelled name in their school login credentials. They were advised to contact the admissions department to correct the error on their end before it could be updated in the school's system."},{"t":"2026-08-27T12:22:28","ag":"Meenash Fernandes","w":9,"k":2108,"a":1,"s":3.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"Debra Page received an email requesting to set up Multi-Factor Authentication (MFA) using the Microsoft Authenticator app. She expressed inability to download the app on her old laptop and was instructed to use her phone instead. She was unsure how to scan the QR code and opted to postpone setting up until after a three-week trip. A representative guided her through the setup process on her phone "},{"t":"2026-08-27T11:21:40","ag":"Meenash Fernandes","w":443,"k":9,"a":1,"s":0.0,"src":"hotline","lb":"","q":"LAMDA Hotline","sum":"The call contains d Microsoft account password. The GDSP representative agreed to send the new login details within five minutes via the existing ticket."},{"t":"2026-09-01T11:30:54","ag":"Ryan Brazil","w":17,"k":103,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"A courier from Gauffre called to confirm the pickup entrance for a parcel he needs to deliver to WC1B5KU. The caller provided his location in a car park near studios 10 to 13. The recipient, at Cookson Adventures, verified the details and agreed to meet the courier downstairs to hand over the parcel."},{"t":"2026-08-27T15:09:49","ag":"Oliver Cromwell","w":53,"k":589,"a":1,"s":3.0,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":"Regan from Cooks and Adventures contacted Oliver to assist with setting up a new MacBook for a colleague named Talia. They discussed connecting the device online and setting up necessary accounts and software, including Outlook, to prepare for an upcoming onboarding call scheduled for Tuesday."},{"t":"2026-08-27T10:58:20","ag":"Ryan Brazil","w":36,"k":102,"a":1,"s":4.0,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":"The caller inquired about the availability of Oliver, who was handling a ticket for a new starter's remote laptop setup. Since Oliver was out, the caller expressed the need to schedule this setup, but confirmed it was not urgent as the new starter begins next week. Oliver is expected back in the afternoon, and the caller's request was noted for follow-up."},{"t":"2026-08-26T15:14:58","ag":"Jansen Paul Villafuerte","w":54,"k":189,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Regan from Cookson Adventures called to follow up on a ticket for a new starter, who needs IT induction, phone, and laptop setup by tomorrow due to a last-minute visa approval. They requested to establish a remote session for laptop setup. The service representative assured to follow up on the ticket and accommodate the request."},{"t":"2026-08-11T17:07:21","ag":"Nazheer Beedassy","w":11,"k":254,"a":1,"s":1.5,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":"Regan from Cooks and Avengers called Oliver because a laptop was offline and needed fixing. They discussed syncing issues with OneDrive, specifically ensuring that the user's personal and company OneDrive accounts were correctly accessible. Oliver aimed to replicate the correct settings and agreed to update the support ticket accordingly."},{"t":"2026-08-11T15:59:07","ag":"Oliver Cromwell","w":29,"k":119,"a":1,"s":3.0,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":"Regan from Crooks and Adventures called Oliver from VTSG to address issues with Alexandra's OneDrive setup on her laptop before she starts work. The specific problems discussed were the duplication of a marketing folder and the absence of a personal OneDrive folder for Alexandra. Oliver agreed to address these issues promptly as Alexandra begins work the next day."},{"t":"2026-08-11T12:09:59","ag":"Promi Sheikh","w":17,"k":335,"a":1,"s":4.0,"src":"named","lb":"","q":"Helpdesk","sum":"Emma from Cookson contacted Prami regarding an issue with SharePoint storage not saving files, displaying 'read-only' errors due to full storage. Prami resolved the issue by increasing the site's storage limit from two to 2.5 terabytes, which should reflect changes within a few minutes. Emma confirmed the fix and planned to inform her team."},{"t":"2026-08-03T09:09:43","ag":"Promi Sheikh","w":3,"k":186,"a":1,"s":null,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":""},{"t":"2026-07-29T15:22:32","ag":"Ian Welch","w":59,"k":186,"a":1,"s":null,"src":"contact","lb":"Cookson Adventures Reagan Fisher","q":"Helpdesk","sum":""},{"t":"2026-07-27T15:35:24","ag":"Oliver Cromwell","w":193,"k":94,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-03T14:45:47","ag":"Robbie Ramsay","w":20,"k":221,"a":1,"s":nul e "},{"t":"2026-06-24T14:51:17","ag":"Rez Lander","w":53,"k":353,"a":1,"s":null,"src":"contact","lb":"Raymond (Europe) Ltd. Shaima Merchant","q":"Helpdesk","sum":""},{"t":"2026-06-24T14:16:10","ag":"Dishon Pawar","w":5,"k":766,"a":1,"s":null,"src":"contact","lb":"Raymond (Europe) Ltd. Shaima Merchant","q":"Helpdesk","sum":""}],"John Stockwell":[{"t":"2026-09-02T10:46:58","ag":"Jansen Paul Villafuerte","w":41,"k":2282,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Lynn from John Stockwell Ltd. contacted Vito's Yelp Desk due to an issue with sending emails, receiving an error message annually. The representative identified the issue as an expired certificate and updated it remotely on Lynn's Microsoft tenant to resolve the email sending problem."},{"t":"2026-08-20T10:58:01","ag":"Dishon Pawar","w":224,"k":677,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Lynn from John Stockwell Limited called the Helpdesk to ensure the Office 365 client secret key was updated and would not expire unexpectedly, as it typically renews yearly. Dishon, the Helpdesk agent, checked and confirmed that the key had already been renewed until April 2028, but offered to check further and follow up with Lynn."},{"t":"2026-06-26T11:52:10","ag":"Promi Sheikh","w":15,"k":273,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-06-26T11:30:15","ag":"Promi Sheikh","w":32,"k":607,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""}],"Rossair":[{"t":"2026-08-25T10:04:37","ag":"Dylan Waterhouse","w":82,"k":820,"a":1,"s":4.0,"src":"number","lb":"","q":"Helpdesk","sum":"Mukta from Mosair contacted tech support because they were unable to open a PDF file. The support staff discovered the file was actually a DWG drawing file for AutoCAD. They advised Mukta not to install unnecessary PDF converter extensions and helped install Autodesk's DWG TrueView, a recommended app for viewing DWG files. During the call, they also explored converting DWG files to PDF . Ryan attempted to troubleshoot by checking the login credentials and verifying the account setup but encountered issues with network connections and Internet access, lead"},{"t":"2026-08-20T13:19:26","ag":"Promi Sheikh","w":5,"k":3301,"a":1,"s":3.0,"src":"named","lb":"","q":"Helpdesk","sum":"Vicky from Kidspace Ventures called for assistance setting up her newly delivered replacement laptop. She had difficulty connecting to Wi-Fi and logging into her user profile. The support technician helped her connect to Wi-Fi using the correct password and confirmed her computer was running Windows Pro. They also discussed the management and setup of Sage 50 on her system."},{"t":"2026-08-12T10:29:06","ag":"","w":48,"k":0,"a":0,"s":null,"src":"contact","lb":"Kidspace Adventures Ltd Rhianna Ross","q":"Helpdesk","sum":""},{"t":"2026-08-12T09:23:57","ag":"Dishon Pawar","w":228,"k":1813,"a":1,"s":3.0,"src":"number","lb":"","q":"Helpdesk","sum":"Rihanna reported an issue with her laptop where a LinkedIn page opens automatically while she is working on other tasks. Despite attempts to troubleshoot, the issue was not resolved during the call, and Rihanna had to leave for a doctor's appointment but mentioned needing to call back later."},{"t":"2026-07-29T14:38:03","ag":"Dishon Pawar","w":22,"k":229,"a":1,"s":null,"src":"contact","lb":"Kidspace Adventures Ltd Victoria Russell","q":"Helpdesk","sum":""},{"t":"2026-07-29T13:30:10","ag":"Nazheer Beedassy","w":4,"k":183,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-22T10:08:35","ag":"Dishon Pawar","w":4,"k":470,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-15T16:27:37","ag":"Oliver Cromwell","w":17,"k":157,"a":1,"s":null,"src":"number","lb":"","q":"Helpdesk","sum":""},{"t":"2026-07-06T09:57:57","ag":"Nazheer Beedassy","w":39,"k":92,"a":1,"s":null,"src":"contact","lb":"Kidspace Adventures Ltd Rhianna Ross","q":"Helpdesk","sum":""}],"Agility Trains":[{"t":"2026-08-28T08:50:18","ag <script>
const D = JSON.parse(document.getElementById('payload').textContent);
const CL = D.clients, P = D.portfolio, PH = D.phone;
const byName = {}; CL.forEach(c => byName[c.name] = c);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ---------- formatting ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0 = v => v == null ? '—' : Math.round(v).toLocaleString('en-GB');
const n1 = v => v == null ? '—' : v.toFixed(1);
function fmtH(h){                       // decimal hours -> "13h 40m"
  if (h == null) return '—';
  const t = Math.round(h * 60);
  return (t >= 60 ? Math.floor(t / 60) + 'h ' : '') + String(t % 60).padStart(t >= 60 ? 2 : 1, '0') + 'm';
}
function fmtS(s){                       // seconds -> "56s" / "6m 55s"
  if (s == null) return '—';
  s = Math.round(s);
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
}
const mins = s => s == null ? '—' : Math.round(s / 60).toLocaleString('en-GB');
const day = iso => { const d = new Date(iso); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}); };
const dayTime = iso => { const d = new Date(iso); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' ' + d.toTimeString().slice(0,5); };

// Every client is benchmarked against the portfolio average for the same measure.
function rag(v, ref){
  if (v == null) return ['p-none','no data'];
  if (v <= ref * 0.9) return ['p-fast','faster than average'];
  if (v <= ref * 1.25) return ['p-avg','around average'];
  if (v <= ref * 1.75) return ['p-watch','slower'];
  return ['p-over','much slower'];
}
function ragPill(v, ref){
  const [cls, txt] = rag(v, ref);
  return `<span class="pill ${cls}">${txt}</span>`;
}

/* ---------- charts ---------- */
function hBars(items, opt = {}){
  // items: [{label, value, note}]
  const W = 720, rowH = 26, padL = opt.padL || 205, padR = 58;
  const H = items.length * rowH + 6;
  const max = Math.max(...items.map(i => i.value), 1);
  const bw = W - padL - padR;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  items.forEach((it, i) => {
    const y = i * rowH + 4, w = Math.max(1.5, it.value / max * bw);
    s += `<g class="bar-row">
      <text x="${padL - 10}" y="${y + 12}" text-anchor="end" font-size="12" fill="#344054">${esc(it.label.length > 30 ? it.label.slice(0,29) + '…' : it.label)}</text>
      <rect class="bar" x="${padL}" y="${y + 2}" width="${w}" height="13" rx="2" fill="${it.fill || 'var(--verd)'}"></rect>
      <text x="${padL + w + 7}" y="${y + 13}" font-size="11.5" fill="#475467">${esc(it.note)}</text>
    </g>`;
  });
  return s + '</svg>';
}

function colChart(items, opt = {}){
  // items: [{label, value}]  vertical columns + optional target line
  const W = 720, H = opt.h || 210, padL = 44, padB = 26, padT = 10;
  const max = opt.max || Math.max(...items.map(i => i.value), 1);
  const nice = Math.ceil(max / 5) * 5 || 1;
  const cw = (W - padL - 8) / items.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g = 0; g <= 4; g++){
    const y = padT + (H - padT - padB) * g / 4, v = nice * (1 - g / 4);
    s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#98a2b3">${opt.fmt ? opt.fmt(v) : Math.round(v)}</text>`;
  }
  items.forEach((it, i) => {
    const h = (it.value / nice) * (H - padT - padB);
    const x = padL + i * cw + cw * 0.18, w = cw * 0.64;
    s += `<rect x="${x}" y="${H - padB - h}" width="${w}" height="${Math.max(h,0.8)}" rx="2" fill="${it.fill || 'var(--ink-soft)'}"><title>${esc(it.label)}: ${opt.fmt ? opt.fmt(it.value) : it.value}</title></rect>`;
    if (!opt.every || i % opt.every === 0)
      s += `<text x="${x + w / 2}" y="${H - padB + 14}" text-anchor="middle" font-size="10.5" fill="#667085">${esc(it.label)}</text>`;
  });
  return s + '</svg>';
}

function lineChart(items, opt = {}){
  const W = 720, H = opt.h || 210, padL = 44, padB = 26, padT = 12;
  const vals = items.map(i => i.value).filter(v => v != null);
  const nice = Math.ceil(Math.max(...vals, opt.target || 0) / 5) * 5 || 1;
  const px = i => padL + (W - padL - 10) * (items.length === 1 ? 0.5 : i / (items.length - 1));
  const py = v => padT + (H - padT - padB) * (1 - v / nice);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g = 0; g <= 4; g++){
    const y = padT + (H - padT - padB) * g / 4, v = nice * (1 - g / 4);
    s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/>
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#98a2b3">${opt.fmt ? opt.fmt(v) : Math.round(v)}</text>`;
  }
  if (opt.target)
    s += `<line x1="${padL}" x2="${W}" y1="${py(opt.target)}" y2="${py(opt.target)}" stroke="var(--watch)" stroke-dasharray="4 3"/>
          <text x="${W}" y="${py(opt.target) - 5}" text-anchor="end" font-size="10.5" fill="var(--watch)">${esc(opt.targetLabel || 'target')} ${opt.target}h</text>`;
  const pts = items.map((it, i) => it.value == null ? null : [px(i), py(it.value)]).filter(Boolean);
  s += `<polyline fill="none" stroke="var(--verd)" stroke-width="2" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  items.forEach((it, i) => {
    if (it.value == null) return;
    s += `<circle cx="${px(i)}" cy="${py(it.value)}" r="3" fill="var(--verd-dk)"><title>${esc(it.label)}: ${opt.fmt ? opt.fmt(it.value) : it.value}</title></circle>`;
    if (!opt.every || i % opt.every === 0)
      s += `<text x="${px(i)}" y="${H - padB + 14}" text-anchor="middle" font-size="10.5" fill="#667085">${esc(it.label)}</text>`;
  });
  return s + '</svg>';
}

function groupBars(series, labels, opt = {}){
  // series: [{name, values, fill}]
  const W = 720, H = opt.h || 200, padL = 40, padB = 26, padT = 10;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const nice = Math.ceil(max / 4) * 4 || 1;
  const gw = (W - padL - 10) / labels.length;
  const bw = gw * 0.72 / series.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g = 0; g <= 4; g++){
    const y = padT + (H - padT - padB) * g / 4;
    s += `<line x1="${padL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/>
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#98a2b3">${Math.round(nice * (1 - g / 4))}</text>`;
  }
  labels.forEach((lb, i) => {
    series.forEach((sr, j) => {
      const v = sr.values[i] || 0, h = v / nice * (H - padT - padB);
      const x = padL + i * gw + gw * 0.14 + j * bw;
      s += `<rect x="${x}" y="${H - padB - h}" width="${bw - 2}" height="${Math.max(h, 0.8)}" rx="2" fill="${sr.fill}"><title>${esc(lb)} ${esc(sr.name)}: ${v}</title></rect>`;
    });
    s += `<text x="${padL + i * gw + gw / 2}" y="${H - padB + 14}" text-anchor="middle" font-size="10.5" fill="#667085">${esc(lb)}</text>`;
  });
  return s + '</svg>';
}

let sortState = {key:'tickets', dir:-1};
function drawTable(){
  const q = (document.getElementById('tblSearch')?.value || '').toLowerCase();
  const rows = CL.filter(c => !q || c.name.toLowerCase().includes(q))
    .slice().sort((a,b) => {
      const k = sortState.key;
      let x = a[k], y = b[k];
      if (typeof x === 'string' || typeof y === 'string') return String(x||'').localeCompare(String(y||'')) * sortState.dir;
      x = x == null ? -1 : x; y = y == null ? -1 : y;
      return (x - y) * sortState.dir;
    });
  document.querySelectorAll('#clientTable th[data-sort]').forEach(th => {
    const on = th.dataset.sort === sortState.key;
    th.innerHTML = th.textContent.replace(/[ ▲▼]+$/,'') + (on ? ` <span class="arw">${sortState.dir > 0 ? '▲' : '▼'}</span>` : '');
  });
  document.querySelector('#clientTable tbody').innerHTML = rows.map(c => `
    <tr class="click" data-c="${esc(c.name)}">
      <td class="cname">${esc(c.name)}${c.in_kpi ? '' : ' <span class="tag">no queue tickets</span>'}</td>

      <div class="tile"><div class="k">Calls attributed</div><div class="v">${c.calls || '—'}</div><div class="n">${c.calls ? [[c.calls_hotline,'own queue'],[c.calls_contact,'contact record'],[c.calls_named,'named in call'],[c.calls_number,'by number']].filter(x => x[0]).map(x => x[0] + ' ' + x[1]).join(', ') : 'no calls identified'}</div></div>
      <div class="tile"><div class="k">Time on the phone</div><div class="v">${c.talk_s ? mins(c.talk_s) + '<small> min</small>' : '—'}</div><div class="n">${c.avg_talk ? 'average ' + fmtS(c.avg_talk) + ' per answered call' : ''}</div></div>
      <div class="tile"><div class="k">Call sentiment</div><div class="v">${c.sentiment != null ? c.sentiment.toFixed(1) + '<small> / 5</small>' : '—'}</div><div class="n">${c.missed ? c.missed + ' missed or abandoned' : c.calls ? 'all identified calls answered' : ''}</div></div>
    </div>
  </section>

  ${c.months ? `<section>
    <div class="sec-head"><div><h2>Ticket volume through 2026</h2>
      <p>All queues, from the yearly Autotask summary — wider than the Helpdesk-only figures above, and useful for spotting a client whose demand is building.</p></div></div>
    <div class="card pad">
      ${groupBars([
        {name:'Raised', values: c.months.map(m => m[0]), fill:'var(--ink-soft)'},
        {name:'Closed', values: c.months.map(m => m[1]), fill:'var(--verd)'}
      ], MONTHS)}
      <div class="legend"><span><i class="sw" style="background:var(--ink-soft)"></i>Raised</span><span><i class="sw" style="background:var(--verd)"></i>Closed</span><span class="muted">September is part-month (to the 7th)</span></div>
    </div>
  </section>` : ''}

  <section>
    <div class="sec-head"><div><h2>Engineer cover</h2></div></div>
    <div class="card pad">
      <p class="notes" style="margin:0">${c.top_eng && c.top_eng_tickets
        ? `<b>${esc(c.top_eng)}</b> handled the most tickets with logged work for this client — ${c.top_eng_tickets} tickets and ${c.top_eng_hours} logged hours.`
        : 'No logged time entries for this client in the window, so no engineer can be attributed by recorded work.'}
      ${calls.length ? ' On the phone, ' + Object.entries(calls.filter(x => x.ag).reduce((a,x) => (a[x.ag] = (a[x.ag]||0)+1, a), {})).sort((a,b) => b[1]-a[1]).slice(0,3).map(([k,v]) => `${esc(k)} (${v})`).join(', ') + ' took the most calls.' : ''}</p>
    </div>
  </section>

  <section>
    <div class="sec-head"><div><h2>Identified calls</h2>
      <p class="calls-note">Newest first. Wait is time in the queue before an engineer picked up; talk time covers answered calls only.</p></div></div>
    ${queueNote(c) ? `<div class="callout" style="margin-bottom:14px">${queueNote(c)}</div>` : ''}
    ${calls.length ? `<div class="tbl-scroll"><table>
      <thead><tr><th>Date</th><th>Queue</th><th>Engineer</th><th class="num">Wait</th><th class="num">Talk</th><th class="num">Sentiment</th><th>Match</th><th>What the call was about</th></tr></thead>
      <tbody>${calls.map(x => `<tr>
        <td>${dayTime(x.t)}</td>
        <td class="muted">${esc(x.q)}</td>
        <td>${x.ag ? esc(x.ag) : '<span class="muted">not answered</span>'}</td>
        <td class="num">${fmtS(x.w)}</td>
        <td class="num">${x.a ? fmtS(x.k) : '—'}</td>
        <td class="num">${x.s != null ? x.s.toFixed(1) : '—'}</td>
        <td><span class="tag" title="${x.src === 'contact' ? esc(x.lb) : ''}">${x.src === 'hotline' ? 'hotline' : x.src === 'contact' ? 'contact' : x.src === 'named' ? 'named' : 'number'}</span></td>
        <td>${x.sum ? (x.sum.length > 150
              ? `<details class="callrow"><summary>${esc(x.sum.slice(0,150))}…</summary>${esc(x.sum)}</details>`
              : esc(x.sum))
            : '<span class="muted">no call notes recorded</span>'}</td></tr>`).join('')}
      </tbody></table></div>`
    : `<div class="card empty">No calls could be tied to this client. Either they raise work by email and portal, or their calls had no recording or notes to match on.</div>`}
  </section>`;

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('clientSel').value = '__all__'; show('__all__');
  });
}

/* ---------- routing ---------- */
function show(v){
  const ov = document.getElementById('overview'), cv = document.getElementById('client');
  if (v === '__all__'){ ov.classList.remove('hide'); cv.classList.add('hide'); renderOverview(); }
  else { cv.classList.remove('hide'); ov.classList.add('hide'); renderClient(v); }
  window.scrollTo({top:0, behavior:'instant'});
}

const sel = document.getElementById('clientSel');
sel.innerHTML = `<option value="__all__">All clients — portfolio overview</option>` +
  CL.map(c => `<option value="${esc(c.name)}">${esc(c.name)} — ${c.tickets ? n0(c.tickets) + ' tickets' : 'calls only'}</option>`).join('');
sel.addEventListener('change', () => show(sel.value));
show('__all__');

</script>
</body>
</html>
